// ---------------------------------------------------------------------------
// Design tokens
// ---------------------------------------------------------------------------
const COLORS = {
  bg: "#FBFAF6", ink: "#22261E", inkSoft: "#5B6156",
  sage: "#3F6657", sageLight: "#E4ECE6",
  urgent: "#B5651D", urgentLight: "#F5E6D3",
  line: "#E4DFD1", card: "#FFFFFF",
};
const CHILD_PALETTE = ["#3E5C8A", "#A9506B", "#4C8068", "#B5651D", "#6B5AA8", "#2F7A7A"];

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
}
function fmtDay(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function KidChip({ kid, size = "sm" }) {
  if (!kid) return null;
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full font-medium ${size === "sm" ? "text-[11px] px-2 py-0.5" : "text-xs px-2.5 py-1"}`}
      style={{ background: kid.color + "22", color: kid.color }}>
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: kid.color }} />
      {kid.name}
    </span>
  );
}

function TopBar({ title, subtitle }) {
  return (
    <div className="px-5 md:px-8 pt-6 pb-4">
      <h1 className="text-[26px] leading-tight" style={{ fontFamily: "'Fraunces', serif", color: COLORS.ink, fontWeight: 600 }}>{title}</h1>
      {subtitle && <p className="text-[13px] mt-1" style={{ color: COLORS.inkSoft }}>{subtitle}</p>}
    </div>
  );
}

function EmptyNote({ text }) {
  return (
    <div className="rounded-xl px-4 py-3 text-[13px]" style={{ background: COLORS.card, border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft }}>
      {text}
    </div>
  );
}

function LoadingScreen({ title }) {
  return (
    <div className="pb-6">
      <TopBar title={title} />
      <div className="px-5 md:px-8 flex items-center gap-2" style={{ color: COLORS.inkSoft }}>
        <Icon name="loader" size={15} spin /> <span className="text-[13.5px]">Загрузка…</span>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Shared family/children data hook — every screen that needs family context uses this
// ---------------------------------------------------------------------------
function useFamily() {
  const [familyId, setFamilyId] = useState(null);
  const [kids, setKids] = useState([]);
  const [loading, setLoading] = useState(true);

  const reload = async () => {
    setLoading(true);
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { setLoading(false); return; }

    let { data: members } = await sb.from("family_members").select("family_id").eq("user_id", user.id).order("created_at", { ascending: false }).limit(1);
    let fid = members && members[0] ? members[0].family_id : null;

    if (!fid) {
      const { data: fam, error: famErr } = await sb.from("families").insert({ name: "Моя семья" }).select("id").single();
      if (!famErr && fam) {
        await sb.from("family_members").insert({ family_id: fam.id, user_id: user.id, role: "parent" });
        fid = fam.id;
      }
    }
    setFamilyId(fid);

    if (fid) {
      const { data: childrenData } = await sb.from("children").select("id, name, age, color").eq("family_id", fid).order("created_at");
      setKids(childrenData || []);
    }
    setLoading(false);
  };

  useEffect(() => { reload(); }, []);
  return { familyId, kids, loading, reload };
}

      setNotes(nt || []);
      setLoadingData(false);

  if (loading || loadingData) return <LoadingScreen title="Сегодня" />;

  return (
    <div className="pb-6">
      <TopBar title="Сегодня" subtitle={new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })} />

          <h2 className="text-[13px] font-semibold tracking-tight mb-2" style={{ color: COLORS.inkSoft }}>Ближайшие события</h2>

            <div className="rounded-2xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>

                return (
                  <div key={e.id} className="flex gap-3 px-4 py-3.5"

                    <div className="min-w-0">
                      {kid && <div className="mb-1"><KidChip kid={kid} /></div>}
                      <p className="text-[14.5px] leading-snug" style={{ color: COLORS.ink }}>{e.title}</p>
                      <p className="text-[12.5px] mt-0.5" style={{ color: COLORS.inkSoft }}>
                        {fmtDateTime(e.starts_at)}{e.location ? ` · ${e.location}` : ""}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <div>
          <h2 className="text-[13px] font-semibold tracking-tight mb-2" style={{ color: COLORS.inkSoft }}>Недавние записи</h2>
          {notes.length === 0 ? (
            <EmptyNote text="Пока нет ни одной записи — добавьте во «Входящих» или в карточке ребёнка." />
          ) : (
            <div className="rounded-2xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
              {notes.map((n, idx) => {
                const kid = kidOf(n.child_id);
                return (
                  <div key={n.id} className="px-4 py-3" style={{ borderBottom: idx < notes.length - 1 ? `1px solid ${COLORS.line}` : "none" }}>
                    {kid && <div className="mb-1"><KidChip kid={kid} /></div>}
                    <p className="text-[14px] leading-snug" style={{ color: COLORS.ink }}>{n.text}</p>
                    <p className="text-[12px] mt-0.5" style={{ color: COLORS.inkSoft }}>{fmtDateTime(n.created_at)}</p>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Screen: Входящие
// ---------------------------------------------------------------------------
function InboxScreen() {
  const { familyId, kids, loading } = useFamily();
  const [entries, setEntries] = useState([]);
  const [loadingEntries, setLoadingEntries] = useState(true);
  const [text, setText] = useState("");
  const [childId, setChildId] = useState("");
  const [saving, setSaving] = useState(false);

  const load = async (fid) => {
    setLoadingEntries(true);
    const { data } = await sb.from("vtoroy_mozg_entries").select("id, text, created_at, child_id").eq("family_id", fid).order("created_at", { ascending: false });
    setEntries(data || []);
    setLoadingEntries(false);
  };
  useEffect(() => { if (familyId) load(familyId); }, [familyId]);

  const send = async () => {
    if (!text.trim() || !familyId) return;
    setSaving(true);
    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from("vtoroy_mozg_entries").insert({
      family_id: familyId, child_id: childId || null, text: text.trim(), created_by: user?.id,
    });
    setSaving(false);
    if (!error) { setText(""); setChildId(""); load(familyId); }
  };

  const kidOf = (id) => kids.find((k) => k.id === id);

  if (loading) return <LoadingScreen title="Входящие" />;

  return (
    <div className="pb-6">
      <TopBar title="Входящие" subtitle="Записывайте сюда всё, что нужно не забыть" />
      <div className="px-5 md:px-8 mb-5">
        <div className="rounded-2xl p-3" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
          <textarea value={text} onChange={(e) => setText(e.target.value)} rows={2}
            placeholder="Например: у Арсения тренировка в четверг в 18:00"
            className="w-full rounded-xl px-3 py-2 text-[14px] outline-none resize-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
          <div className="flex items-center gap-2 mt-2">
            {kids.length > 0 && (
              <select value={childId} onChange={(e) => setChildId(e.target.value)} className="rounded-xl px-2 py-2 text-[13px] flex-1" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}>
                <option value="">Без привязки к ребёнку</option>
                {kids.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}
              </select>
            )}
            <button disabled={saving || !text.trim()} onClick={send} className="rounded-xl px-4 py-2 text-[13.5px] font-medium text-white disabled:opacity-50 shrink-0" style={{ background: COLORS.sage }}>
              {saving ? "Сохраняю…" : "Сохранить"}
            </button>
          </div>
        </div>
      </div>
      <div className="px-5 md:px-8 space-y-2">
        {loadingEntries ? (
          <p className="text-[13px]" style={{ color: COLORS.inkSoft }}>Загрузка…</p>
        ) : entries.length === 0 ? (
          <EmptyNote text="Пока пусто." />
        ) : entries.map((e) => {
          const kid = kidOf(e.child_id);
          return (
            <div key={e.id} className="rounded-xl p-3" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
              {kid && <div className="mb-1"><KidChip kid={kid} /></div>}
              <p className="text-[14px] leading-snug" style={{ color: COLORS.ink }}>{e.text}</p>
              <p className="text-[12px] mt-1" style={{ color: COLORS.inkSoft }}>{fmtDateTime(e.created_at)}</p>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Screen: Календарь семьи
// ---------------------------------------------------------------------------
function CalendarScreen() {
  const { familyId, kids, loading } = useFamily();
  const [events, setEvents] = useState([]);
  const [loadingEvents, setLoadingEvents] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [title, setTitle] = useState("");
  const [when, setWhen] = useState("");
  const [childId, setChildId] = useState("");
  const [location, setLocation] = useState("");
  const [saving, setSaving] = useState(false);

  const loadEvents = async (fid) => {
    setLoadingEvents(true);
    const { data } = await sb.from("events").select("id, title, starts_at, location, child_id").eq("family_id", fid).order("starts_at");
    setEvents(data || []);
    setLoadingEvents(false);
  };
  useEffect(() => { if (familyId) loadEvents(familyId); }, [familyId]);

  const addEvent = async () => {
    if (!title.trim() || !when || !familyId) return;
    setSaving(true);
    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from("events").insert({
      family_id: familyId, child_id: childId || null, title: title.trim(),
      starts_at: new Date(when).toISOString(), location: location.trim() || null, created_by: user?.id,
    });
    setSaving(false);
    if (!error) {
      setTitle(""); setWhen(""); setChildId(""); setLocation(""); setShowAdd(false);
      loadEvents(familyId);
    }
  };

  const kidOf = (id) => kids.find((k) => k.id === id);
  const groups = {};
  events.forEach((e) => { const key = fmtDay(e.starts_at); (groups[key] = groups[key] || []).push(e); });

  if (loading || loadingEvents) return <LoadingScreen title="Календарь семьи" />;

  return (
    <div className="pb-6">
      <TopBar title="Календарь семьи" />
      <div className="px-5 md:px-8 mb-4">
        <button onClick={() => setShowAdd((v) => !v)} className="rounded-2xl px-4 py-2.5 flex items-center gap-1.5"
          style={{ background: COLORS.card, border: `1px dashed ${COLORS.line}`, color: COLORS.sage }}>
          <Icon name="plus" size={14} /><span className="text-[13.5px] font-medium">Добавить событие</span>
        </button>
      </div>
      {showAdd && (
        <div className="px-5 md:px-8 mb-5">
          <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
            <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Что за событие"
              className="w-full rounded-xl px-3 py-2 text-[14px] mb-2 outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
            <input type="datetime-local" value={when} onChange={(e) => setWhen(e.target.value)}
              className="w-full rounded-xl px-3 py-2 text-[14px] mb-2 outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
            <input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="Место (необязательно)"
              className="w-full rounded-xl px-3 py-2 text-[14px] mb-2 outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
            {kids.length > 0 && (
              <select value={childId} onChange={(e) => setChildId(e.target.value)} className="w-full rounded-xl px-3 py-2 text-[14px] mb-3" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}>
                <option value="">Без привязки к ребёнку</option>
                {kids.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}
              </select>
            )}
            <button disabled={saving || !title.trim() || !when} onClick={addEvent}
              className="w-full rounded-xl py-2.5 text-[13.5px] font-medium text-white disabled:opacity-50" style={{ background: COLORS.sage }}>
              {saving ? "Сохраняю…" : "Сохранить"}
            </button>
          </div>
        </div>
      )}
      <div className="px-5 md:px-8 space-y-4">
        {Object.keys(groups).length === 0 ? (
          <EmptyNote text="Событий пока нет." />
        ) : Object.entries(groups).map(([day, items]) => (
          <div key={day}>
            <div className="text-[12.5px] font-semibold mb-1.5" style={{ color: COLORS.inkSoft }}>{day}</div>
            <div className="rounded-2xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
              {items.map((it, idx) => {
                const kid = kidOf(it.child_id);
                return (
                  <div key={it.id} className="flex items-center gap-3 px-4 py-3"
                    style={{ borderLeft: `3px solid ${kid ? kid.color : COLORS.sage}`, borderBottom: idx < items.length - 1 ? `1px solid ${COLORS.line}` : "none" }}>
                    <span className="text-[13px] font-medium w-11 shrink-0" style={{ color: COLORS.ink }}>{fmtTime(it.starts_at)}</span>
                    <div className="min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">{kid && <KidChip kid={kid} />}<span className="text-[14px]" style={{ color: COLORS.ink }}>{it.title}</span></div>
                      {it.location && <p className="text-[12px] mt-0.5 flex items-center gap-1" style={{ color: COLORS.inkSoft }}><Icon name="mapPin" size={11} /> {it.location}</p>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

  const [newName, setNewName] = useState("");
  const [newAge, setNewAge] = useState("");
  const [saving, setSaving] = useState(false);
  const [notes, setNotes] = useState([]);
  const [noteText, setNoteText] = useState("");
  const [notesLoading, setNotesLoading] = useState(false);

  useEffect(() => { if (!activeKidId && kids.length > 0) setActiveKidId(kids[0].id); }, [kids]);

  const loadNotes = async (childId) => {
    if (!childId) { setNotes([]); return; }
    setNotesLoading(true);
    const { data } = await sb.from("vtoroy_mozg_entries").select("id, text, created_at").eq("child_id", childId).order("created_at", { ascending: false });
    setNotes(data || []);
    setNotesLoading(false);
  };
  useEffect(() => { loadNotes(activeKidId); }, [activeKidId]);

  const addChild = async () => {
    if (!newName.trim() || !familyId) return;
    setSaving(true);
    const color = CHILD_PALETTE[kids.length % CHILD_PALETTE.length];
    const { data, error } = await sb.from("children").insert({
      family_id: familyId, name: newName.trim(), age: newAge ? parseInt(newAge, 10) : null, color,
    }).select("id, name, age, color").single();
    setSaving(false);
    if (error) return;
    await reload();
    setActiveKidId(data.id);
    setNewName(""); setNewAge(""); setShowAdd(false);
  };

  const addNote = async () => {
    if (!noteText.trim() || !activeKidId || !familyId) return;
    const { data: { user } } = await sb.auth.getUser();
    const { data, error } = await sb.from("vtoroy_mozg_entries").insert({
      family_id: familyId, child_id: activeKidId, text: noteText.trim(), created_by: user?.id,
    }).select("id, text, created_at").single();
    if (error) return;
    setNoteText("");
    setNotes((p) => [data, ...p]);
  };

  const activeKid = kids.find((k) => k.id === activeKidId);

  if (loading) return <LoadingScreen title="Дети" />;

  return (
    <div className="pb-6">
      <TopBar title="Дети" />
      <div className="px-5 md:px-8 flex gap-2 mb-4 flex-wrap">
        {kids.map((k) => (
          <button key={k.id} onClick={() => setActiveKidId(k.id)} className="rounded-2xl px-4 py-3 text-left"
            style={{ background: activeKidId === k.id ? k.color + "22" : COLORS.card, border: `1px solid ${activeKidId === k.id ? k.color : COLORS.line}` }}>
            <p className="text-[15px] font-medium" style={{ color: activeKidId === k.id ? k.color : COLORS.ink, fontFamily: "'Fraunces', serif" }}>{k.name}</p>
            {k.age != null && <p className="text-[12px]" style={{ color: COLORS.inkSoft }}>{k.age} лет</p>}
          </button>
        ))}
        <button onClick={() => setShowAdd((v) => !v)} className="rounded-2xl px-4 py-3 flex items-center gap-1.5"
          style={{ background: COLORS.card, border: `1px dashed ${COLORS.line}`, color: COLORS.sage }}>
          <Icon name="plus" size={14} />
          <span className="text-[13.5px] font-medium">Добавить ребёнка</span>
        </button>
      </div>

      {showAdd && (
        <div className="px-5 md:px-8 mb-5">
          <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Имя ребёнка"
              className="w-full rounded-xl px-3 py-2 text-[14px] mb-2 outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
            <input value={newAge} onChange={(e) => setNewAge(e.target.value.replace(/\D/g, ""))} placeholder="Возраст (необязательно)"
              className="w-full rounded-xl px-3 py-2 text-[14px] mb-3 outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
            <button disabled={saving || !newName.trim()} onClick={addChild}
              className="w-full rounded-xl py-2.5 text-[13.5px] font-medium text-white disabled:opacity-50" style={{ background: COLORS.sage }}>
              {saving ? "Сохраняю…" : "Сохранить"}
            </button>
          </div>
        </div>
      )}

      {kids.length === 0 && !showAdd && (
        <div className="px-5 md:px-8">
          <EmptyNote text="Пока нет ни одного ребёнка — нажмите «Добавить ребёнка» выше." />
        </div>
      )}

      {activeKid && (
        <div className="px-5 md:px-8">
          <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
            <h2 className="text-[14.5px] font-medium mb-3" style={{ color: COLORS.ink }}>Заметки и данные — {activeKid.name}</h2>
            <div className="flex gap-2 mb-3">
              <input value={noteText} onChange={(e) => setNoteText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addNote()}
                placeholder="Школа, секции, врачи, что угодно…"
                className="flex-1 rounded-xl px-3 py-2 text-[14px] outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
              <button onClick={addNote} className="rounded-xl px-3 shrink-0" style={{ background: COLORS.sage, color: "#fff" }}>
                <Icon name="send" size={14} />
              </button>
            </div>
            {notesLoading ? (
              <p className="text-[13px]" style={{ color: COLORS.inkSoft }}>Загрузка…</p>
            ) : notes.length === 0 ? (
              <p className="text-[13px]" style={{ color: COLORS.inkSoft }}>Пока ничего не записано.</p>
            ) : (
              <ul className="space-y-2">
                {notes.map((n) => (
                  <li key={n.id} className="text-[13.5px] leading-snug" style={{ color: COLORS.ink, borderTop: `1px solid ${COLORS.line}`, paddingTop: 8 }}>
                    {n.text}
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Screen: Семья
// ---------------------------------------------------------------------------
function randomFamilyCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return `FAM-${s}`;
}

function FamilyScreen() {
  const { familyId, loading } = useFamily();
  const [email, setEmail] = useState("");
  const [codes, setCodes] = useState([]);
  const [loadingCodes, setLoadingCodes] = useState(true);
  const [generating, setGenerating] = useState(false);
  const [joinCode, setJoinCode] = useState("");
  const [joinMsg, setJoinMsg] = useState(null);
  const [joining, setJoining] = useState(false);

  useEffect(() => { sb.auth.getUser().then(({ data }) => setEmail(data.user?.email || "")); }, []);

  const loadCodes = async (fid) => {
    setLoadingCodes(true);
    const { data } = await sb.from("family_invite_codes").select("code, used_by, expires_at").eq("family_id", fid).order("created_at", { ascending: false });
    setCodes(data || []);
    setLoadingCodes(false);
  };
  useEffect(() => { if (familyId) loadCodes(familyId); }, [familyId]);

  const createCode = async () => {
    if (!familyId) return;
    setGenerating(true);
    const { data: { user } } = await sb.auth.getUser();
    const code = randomFamilyCode();
    const { error } = await sb.from("family_invite_codes").insert({
      family_id: familyId, code, created_by: user?.id, expires_at: new Date(Date.now() + 14 * 86400000).toISOString(),
    });
    setGenerating(false);
    if (!error) loadCodes(familyId);
  };

  const join = async () => {
    const code = joinCode.trim();
    if (!code) return;
    setJoining(true);
    const { data: sess } = await sb.auth.getSession();
    const jwt = sess.session?.access_token;
    const res = await fetch(SUPABASE_URL + '/functions/v1/join-family', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jwt },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();
    setJoining(false);
    if (!res.ok) return setJoinMsg({ text: data.error || 'Не удалось присоединиться', ok: false });
    setJoinMsg({ text: `Готово — вы в семье «${data.family_name}». Откройте вкладку «Дети», чтобы увидеть общих детей.`, ok: true });
    setJoinCode("");
  };

  if (loading) return <LoadingScreen title="Семья" />;

  return (
    <div className="pb-6">
      <TopBar title="Семья" subtitle={email} />
      <div className="px-5 md:px-8 space-y-4">
        <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
          <h2 className="text-[14.5px] font-medium mb-1" style={{ color: COLORS.ink }}>Пригласить мужа/жену</h2>
          <p className="text-[13px] mb-3" style={{ color: COLORS.inkSoft }}>
            Сгенерируйте код и отправьте партнёру — после входа по коду он увидит тех же детей и то же расписание.
          </p>
          <button disabled={generating} onClick={createCode} className="rounded-xl px-4 py-2.5 text-[13.5px] font-medium text-white disabled:opacity-50" style={{ background: COLORS.sage }}>
            {generating ? "Создаю…" : "Создать код приглашения"}
          </button>
          <div className="mt-3">
            {loadingCodes ? (
              <p className="text-[13px]" style={{ color: COLORS.inkSoft }}>Загрузка…</p>
            ) : codes.length === 0 ? (
              <p className="text-[13px]" style={{ color: COLORS.inkSoft }}>Кодов пока нет.</p>
            ) : (
              <ul className="space-y-1.5">
                {codes.map((c) => (
                  <li key={c.code} className="flex items-center justify-between text-[13px]">
                    <code style={{ background: "#f1f5f9", padding: "2px 7px", borderRadius: 6, fontWeight: 600 }}>{c.code}</code>
                    <span style={{ color: c.used_by ? COLORS.inkSoft : COLORS.sage }}>{c.used_by ? "использован" : "ждёт"}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>

        <div className="rounded-2xl p-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
          <h2 className="text-[14.5px] font-medium mb-3" style={{ color: COLORS.ink }}>У меня есть код</h2>
          <div className="flex gap-2">
            <input value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="FAM-XXXXXXXX"
              className="flex-1 rounded-xl px-3 py-2 text-[14px] outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
            <button disabled={joining || !joinCode.trim()} onClick={join} className="rounded-xl px-4 py-2 text-[13.5px] font-medium text-white disabled:opacity-50 shrink-0" style={{ background: COLORS.sage }}>
              {joining ? "…" : "Присоединиться"}
            </button>
          </div>
          {joinMsg && <p className="text-[12.5px] mt-2" style={{ color: joinMsg.ok ? COLORS.sage : COLORS.urgent }}>{joinMsg.text}</p>}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Screen: Спросить
// ---------------------------------------------------------------------------
function AskScreen() {
  const [messages, setMessages] = useState([]);
  const [value, setValue] = useState("");

  const send = (text) => {
    if (!text.trim()) return;
    setMessages((p) => [...p, { role: "user", text },
      { role: "ai", text: "AI-ответы по вашим реальным данным пока не подключены — это следующий шаг разработки." }]);
    setValue("");
  };

  return (
    <div className="pb-6 flex flex-col" style={{ minHeight: "70vh" }}>
      <TopBar title="Спросить" subtitle="Скоро здесь можно будет спросить о детях на обычном языке" />
      <div className="px-5 md:px-8 flex-1 space-y-3">
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
            <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed"
              style={m.role === "user" ? { background: COLORS.sage, color: "#fff", borderBottomRightRadius: 4 } : { background: COLORS.card, color: COLORS.ink, border: `1px solid ${COLORS.line}`, borderBottomLeftRadius: 4 }}>
              {m.text}
            </div>
          </div>
        ))}
      </div>
      <div className="px-5 md:px-8 mt-4">
        <div className="flex items-center gap-2 rounded-2xl px-3 py-2" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
          <input value={value} onChange={(e) => setValue(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send(value)}
            placeholder="Спроси о детях…" className="flex-1 bg-transparent outline-none text-[14px]" style={{ color: COLORS.ink }} />
          <button onClick={() => send(value)} className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ background: COLORS.sage, color: "#fff" }}>
            <Icon name="send" size={14} />
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Auth gate
// ---------------------------------------------------------------------------
function AuthGate() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const show = (text, ok) => setMsg({ text, ok });

  const signIn = async () => {
    setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    setBusy(false);
    if (error) return show(error.message, false);
  };

  const signUp = async () => {
    setBusy(true);
    const { error } = await sb.auth.signUp({ email, password });
    setBusy(false);
    if (error) return show(error.message, false);
    show("Готово! Если подтверждение email отключено — сразу жмите «Войти».", true);
  };

  return (
    <div className="w-full min-h-screen flex justify-center items-center" style={{ background: "#EDEAE0" }}>
      <div className="w-full" style={{ maxWidth: 380, fontFamily: "'Inter', sans-serif" }}>
        <div className="px-5 mb-6 text-center">
          <h1 className="text-[26px]" style={{ fontFamily: "'Fraunces', serif", color: COLORS.ink, fontWeight: 600 }}>Второй мозг родителя</h1>
          <p className="text-[13px] mt-1" style={{ color: COLORS.inkSoft }}>Войдите, чтобы продолжить</p>
        </div>
        <div className="mx-5 rounded-2xl p-5" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
          <label className="text-[12.5px] block mb-1" style={{ color: COLORS.inkSoft }}>Email</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com"
            className="w-full rounded-xl px-3 py-2 text-[14px] mb-3 outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
          <label className="text-[12.5px] block mb-1" style={{ color: COLORS.inkSoft }}>Пароль</label>
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••"
            className="w-full rounded-xl px-3 py-2 text-[14px] mb-3 outline-none" style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
          <div className="flex gap-2">
            <button disabled={busy} onClick={signIn} className="flex-1 rounded-xl py-2.5 text-[13.5px] font-medium text-white" style={{ background: COLORS.sage }}>Войти</button>
            <button disabled={busy} onClick={signUp} className="flex-1 rounded-xl py-2.5 text-[13.5px] font-medium" style={{ background: COLORS.bg, color: COLORS.sage, border: `1px solid ${COLORS.sage}` }}>Создать аккаунт</button>
          </div>
          {msg && <p className="text-[12.5px] mt-3" style={{ color: msg.ok ? COLORS.sage : COLORS.urgent }}>{msg.text}</p>}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// App shell — responsive: sidebar nav on desktop (md+), bottom tab bar on mobile
// ---------------------------------------------------------------------------
const TABS = [
  { key: "today", label: "Сегодня", icon: "home", screen: TodayScreen },
  { key: "inbox", label: "Входящие", icon: "inbox", screen: InboxScreen },
  { key: "calendar", label: "Календарь", icon: "calendar", screen: CalendarScreen },
  { key: "kids", label: "Дети", icon: "users", screen: ChildrenScreen },
  { key: "family", label: "Семья", icon: "heart", screen: FamilyScreen },
  { key: "ask", label: "Спросить", icon: "sparkles", screen: AskScreen },
];

function MainApp() {
  const [tab, setTab] = useState("today");
  const ActiveScreen = TABS.find((t) => t.key === tab).screen;

  return (
    <div className="w-full min-h-screen md:flex" style={{ background: "#EDEAE0" }}>
      <div className="hidden md:flex md:flex-col md:w-64 md:shrink-0 md:py-6 md:px-3" style={{ borderRight: `1px solid ${COLORS.line}`, background: COLORS.bg }}>
        <div className="px-3 mb-6 flex items-center gap-2">
          <span style={{ fontSize: 20 }}>🧠</span>
          <p style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontWeight: 600, color: COLORS.ink }}>Второй мозг</p>
        </div>
        <div className="flex flex-col gap-1">
          {TABS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex items-center gap-3 px-3 py-2.5 rounded-xl text-left"
                style={{ background: active ? COLORS.sageLight : "transparent", color: active ? COLORS.sage : COLORS.inkSoft }}>
                <Icon name={t.icon} size={18} />
                <span className="text-[14px]" style={{ fontWeight: active ? 600 : 400 }}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div className="flex justify-center md:flex-1 md:items-start">
        <div className="w-full max-w-[430px] md:max-w-[760px] flex flex-col relative" style={{ background: COLORS.bg, fontFamily: "'Inter', sans-serif", minHeight: "100vh" }}>
          <div className="flex-1 overflow-y-auto pb-[84px] md:pb-6">
            <ActiveScreen />
          </div>
          <div className="md:hidden fixed bottom-0 w-full max-w-[430px] flex items-stretch" style={{ background: COLORS.card, borderTop: `1px solid ${COLORS.line}`, paddingBottom: 8 }}>
            {TABS.map((t) => {
              const active = tab === t.key;
              return (
                <button key={t.key} onClick={() => setTab(t.key)} className="flex-1 flex flex-col items-center gap-1 pt-2.5 pb-1">
                  <Icon name={t.icon} size={18} style={{ color: active ? COLORS.sage : COLORS.inkSoft }} />
                  <span className="text-[10px]" style={{ color: active ? COLORS.sage : COLORS.inkSoft, fontWeight: active ? 600 : 400 }}>{t.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return (
      <div className="w-full min-h-screen flex items-center justify-center" style={{ background: "#EDEAE0" }}>
        <Icon name="loader" size={22} spin style={{ color: COLORS.sage }} />
      </div>
    );
  }
  if (!session) return <AuthGate />;
  return <MainApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
