function KidTag({ kidId, size = "sm" }) {
  const kid = KIDS[kidId];
  if (!kid) return null;
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full font-medium ${size === "sm" ? "text-[11px] px-2 py-0.5" : "text-xs px-2.5 py-1"}`}
      style={{ background: kid.tint, color: kid.color }}>
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: kid.color }} />
      {kid.name}
    </span>
  );
}

function TopBar({ title, subtitle }) {
  return (
    <div className="px-5 pt-6 pb-4">
      <h1 className="text-[26px] leading-tight" style={{ fontFamily: "'Fraunces', serif", color: COLORS.ink, fontWeight: 600 }}>{title}</h1>
      {subtitle && <p className="text-[13px] mt-1" style={{ color: COLORS.inkSoft }}>{subtitle}</p>}
    </div>
  );
}

            <div className="rounded-2xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
              {section.items.map((item, idx) => {

                return (

                    style={{ borderLeft: `3px solid ${kid.color}`, borderBottom: idx < section.items.length - 1 ? `1px solid ${COLORS.line}` : "none" }}>
                    <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0 mt-0.5"
                      style={{ background: item.tone === "urgent" ? COLORS.urgentLight : COLORS.sageLight, color: item.tone === "urgent" ? COLORS.urgent : COLORS.sage }}>

                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function InboxScreen() {
  const [items, setItems] = useState(INITIAL_INBOX);
  const [openId, setOpenId] = useState(null);

  const confirm = (id) => { setItems((p) => p.map((it) => it.id === id ? { ...it, status: "confirmed" } : it)); setOpenId(null); };
  const clarify = (id, ok) => {
    setItems((p) => p.map((it) => it.id === id ? (ok ? {
      ...it, status: "draft",
      draft: { kid: "arseniy", title: "Соревнования по футболу", when: "сб, 19 сентября · 11:00", where: "Стадион «Юность»", note: "Приехать за 30 минут — к 10:30" },
    } : { ...it, status: "confirmed" }) : it));
  };

  return (
    <div className="pb-6">
      <TopBar title="AI Inbox" subtitle="Скидывай сюда всё — я разберу" />
      <div className="px-5 space-y-3">
        {items.map((item) => {
          const isOpen = openId === item.id;
          return (
            <div key={item.id} className="rounded-2xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
              <button onClick={() => setOpenId(isOpen ? null : item.id)} className="w-full flex items-start gap-3 px-4 py-3.5 text-left">
                <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ background: COLORS.sageLight, color: COLORS.sage }}>
                  <Icon name={item.kind} size={15} />
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-[12px]" style={{ color: COLORS.inkSoft }}>{item.from}</p>
                  <p className="text-[14.5px] mt-0.5 leading-snug" style={{ color: COLORS.ink }}>{item.preview}</p>
                  <div className="mt-1.5">
                    {item.status === "confirmed" && <span className="inline-flex items-center gap-1 text-[12px] font-medium" style={{ color: COLORS.sage }}><Icon name="check" size={13} /> Добавлено</span>}
                    {item.status === "processing" && <span className="inline-flex items-center gap-1 text-[12px]" style={{ color: COLORS.inkSoft }}><Icon name="loader" size={13} spin /> Анализирую…</span>}
                    {item.status === "clarify" && <span className="inline-flex items-center gap-1 text-[12px] font-medium" style={{ color: COLORS.urgent }}><Icon name="alertTriangle" size={13} /> Нужно уточнение</span>}
                    {item.status === "draft" && <span className="text-[12px] font-medium" style={{ color: COLORS.urgent }}>Проверь и подтверди</span>}
                  </div>
                </div>
                <Icon name="chevronDown" size={16} className="mt-1 shrink-0" style={{ color: COLORS.inkSoft, transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
              </button>

              {isOpen && item.status === "draft" && (
                <div className="px-4 pb-4 pt-1" style={{ borderTop: `1px solid ${COLORS.line}` }}>
                  <div className="rounded-xl p-3 mt-3" style={{ background: COLORS.bg }}>
                    <div className="flex items-center gap-2 mb-2"><KidTag kidId={item.draft.kid} size="md" /></div>
                    <p className="text-[15px] font-medium" style={{ color: COLORS.ink, fontFamily: "'Fraunces', serif" }}>{item.draft.title}</p>
                    <p className="text-[13px] mt-1" style={{ color: COLORS.inkSoft }}>{item.draft.when}</p>
                    {item.draft.where && <p className="text-[13px] flex items-center gap-1 mt-0.5" style={{ color: COLORS.inkSoft }}><Icon name="mapPin" size={12} /> {item.draft.where}</p>}
                    {item.draft.note && <p className="text-[12.5px] mt-2 italic" style={{ color: COLORS.sage }}>{item.draft.note}</p>}
                    {item.draft.followups && (
                      <div className="flex flex-wrap gap-1.5 mt-3">
                        {item.draft.followups.map((f, i) => (
                          <span key={i} className="text-[11.5px] px-2 py-1 rounded-full" style={{ background: COLORS.sageLight, color: COLORS.sage }}>+ {f}</span>
                        ))}
                      </div>
                    )}
                  </div>
                  <div className="flex gap-2 mt-3">
                    <button onClick={() => confirm(item.id)} className="flex-1 rounded-xl py-2.5 text-[13.5px] font-medium text-white flex items-center justify-center gap-1.5" style={{ background: COLORS.sage }}>
                      <Icon name="check" size={15} /> Подтвердить
                    </button>
                    <button className="rounded-xl py-2.5 px-4 text-[13.5px] font-medium" style={{ background: COLORS.bg, color: COLORS.inkSoft, border: `1px solid ${COLORS.line}` }}>Исправить</button>
                  </div>
                </div>
              )}

              {isOpen && item.status === "clarify" && (
                <div className="px-4 pb-4 pt-1" style={{ borderTop: `1px solid ${COLORS.line}` }}>
                  <p className="text-[13.5px] mt-3" style={{ color: COLORS.ink }}>{item.question}</p>
                  <div className="flex gap-2 mt-3">
                    <button onClick={() => clarify(item.id, true)} className="flex-1 rounded-xl py-2.5 text-[13.5px] font-medium text-white" style={{ background: COLORS.sage }}>Да, это Арсений</button>
                    <button onClick={() => clarify(item.id, false)} className="rounded-xl py-2.5 px-4 text-[13.5px] font-medium" style={{ background: COLORS.bg, color: COLORS.inkSoft, border: `1px solid ${COLORS.line}` }}>Нет, это не про детей</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

            <div className="flex items-center gap-2 mb-1.5">
              <span className="text-[12.5px] font-semibold" style={{ color: d.today ? COLORS.sage : COLORS.inkSoft }}>{d.day}</span>
              {d.conflict && <span className="inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-full" style={{ background: COLORS.urgentLight, color: COLORS.urgent }}><Icon name="alertTriangle" size={11} /> совпадение по времени</span>}
            </div>
            {d.items.length === 0 ? (
              <div className="rounded-xl px-4 py-3 text-[13px]" style={{ background: COLORS.card, border: `1px dashed ${COLORS.line}`, color: COLORS.inkSoft }}>Ничего не запланировано</div>
            ) : (
              <div className="rounded-2xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
                {d.items.map((it, idx) => {
                  const kid = KIDS[it.kid];
                  return (
                    <div key={idx} className="flex items-center gap-3 px-4 py-3"
                      style={{ borderLeft: `3px solid ${kid.color}`, borderBottom: idx < d.items.length - 1 ? `1px solid ${COLORS.line}` : "none" }}>
                      <span className="text-[13px] font-medium w-11 shrink-0" style={{ color: COLORS.ink }}>{it.time}</span>
                      <div className="min-w-0">
                        <div className="flex items-center gap-2"><KidTag kidId={it.kid} /><span className="text-[14px]" style={{ color: COLORS.ink }}>{it.title}</span></div>
                        <p className="text-[12px] mt-0.5 flex items-center gap-1" style={{ color: COLORS.inkSoft }}><Icon name="mapPin" size={11} /> {it.place}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function ChildrenScreen() {
  const [activeKid, setActiveKid] = useState("arseniy");
  const [openSection, setOpenSection] = useState(0);
  const kid = KIDS[activeKid];
  const sections = KID_KB[activeKid];

  return (
    <div className="pb-6">
      <TopBar title="Дети" />
      <div className="px-5 flex gap-2 mb-5">
        {Object.values(KIDS).map((k) => (
          <button key={k.id} onClick={() => { setActiveKid(k.id); setOpenSection(0); }} className="flex-1 rounded-2xl px-4 py-3 text-left"
            style={{ background: activeKid === k.id ? k.tint : COLORS.card, border: `1px solid ${activeKid === k.id ? k.color : COLORS.line}` }}>
            <p className="text-[15px] font-medium" style={{ color: activeKid === k.id ? k.color : COLORS.ink, fontFamily: "'Fraunces', serif" }}>{k.name}</p>
            <p className="text-[12px]" style={{ color: COLORS.inkSoft }}>{k.age} лет</p>
          </button>
        ))}
      </div>
      <div className="px-5 space-y-2.5">
        {sections.map((sec, idx) => {
          const isOpen = openSection === idx;
          return (
            <div key={sec.title} className="rounded-2xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
              <button onClick={() => setOpenSection(isOpen ? -1 : idx)} className="w-full flex items-center gap-3 px-4 py-3.5 text-left">
                <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ background: kid.tint, color: kid.color }}><Icon name={sec.icon} size={15} /></div>
                <span className="flex-1 text-[14.5px] font-medium" style={{ color: COLORS.ink }}>{sec.title}</span>
                <Icon name="chevronRight" size={16} style={{ color: COLORS.inkSoft, transform: isOpen ? "rotate(90deg)" : "none", transition: "transform .15s" }} />
              </button>
              {isOpen && (
                <div className="px-4 pb-4 pt-0.5" style={{ borderTop: `1px solid ${COLORS.line}` }}>
                  <ul className="mt-2.5 space-y-1.5">
                    {sec.rows.map((row, i) => (
                      <li key={i} className="text-[13.5px] leading-snug flex gap-2" style={{ color: COLORS.inkSoft }}>
                        <span className="mt-1.5 w-1 h-1 rounded-full shrink-0" style={{ background: kid.color }} />
                        <span style={{ color: COLORS.ink }}>{row}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AskScreen() {
  const [messages, setMessages] = useState([]);
  const [value, setValue] = useState("");
  const [thinking, setThinking] = useState(false);

  const send = (text) => {
    if (!text.trim()) return;
    setMessages((p) => [...p, { role: "user", text }]);
    setValue("");
    setThinking(true);
    setTimeout(() => {
      const answer = ASK_ANSWERS[text] || "В прототипе отвечаю только на пару примеров вопросов — но в реальном приложении здесь будет ответ, собранный из всех данных по детям.";
      setMessages((p) => [...p, { role: "ai", text: answer }]);
      setThinking(false);
    }, 700);
  };

  return (
    <div className="pb-6 flex flex-col" style={{ minHeight: "70vh" }}>
      <TopBar title="Спросить" subtitle="Всё, что знает система — в одном ответе" />
      <div className="px-5 flex-1 space-y-3">
        {messages.length === 0 && (
          <div className="flex flex-wrap gap-2 mb-2">
            {ASK_SUGGESTIONS.map((s) => (
              <button key={s} onClick={() => send(s)} className="text-[13px] px-3 py-2 rounded-xl text-left" style={{ background: COLORS.sageLight, color: COLORS.sage }}>{s}</button>
            ))}
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
            <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed"
              style={m.role === "user" ? { background: COLORS.sage, color: "#fff", borderBottomRightRadius: 4 } : { background: COLORS.card, color: COLORS.ink, border: `1px solid ${COLORS.line}`, borderBottomLeftRadius: 4 }}>
              {m.text}
            </div>
          </div>
        ))}
        {thinking && (
          <div className="flex justify-start">
            <div className="rounded-2xl px-4 py-2.5 flex items-center gap-1.5" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
              <Icon name="loader" size={14} spin style={{ color: COLORS.sage }} />
              <span className="text-[13px]" style={{ color: COLORS.inkSoft }}>Собираю ответ…</span>
            </div>
          </div>
        )}
      </div>
      <div className="px-5 mt-4">
        <div className="flex items-center gap-2 rounded-2xl px-3 py-2" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
          <input value={value} onChange={(e) => setValue(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send(value)}
            placeholder="Спроси о детях…" className="flex-1 bg-transparent outline-none text-[14px]" style={{ color: COLORS.ink }} />
          <button onClick={() => send(value)} className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ background: COLORS.sage, color: "#fff" }}>
            <Icon name="send" size={14} />
          </button>
        </div>
      </div>
    </div>
  );
}

const TABS = [
  { key: "today", label: "Сегодня", icon: "home", screen: TodayScreen },
  { key: "inbox", label: "Inbox", icon: "inbox", screen: InboxScreen },
  { key: "calendar", label: "Календарь", icon: "calendar", screen: CalendarScreen },
  { key: "kids", label: "Дети", icon: "users", screen: ChildrenScreen },
  { key: "ask", label: "Спросить", icon: "sparkles", screen: AskScreen },
];

function App() {
  const [tab, setTab] = useState("today");
  const ActiveScreen = TABS.find((t) => t.key === tab).screen;

  return (
    <div className="w-full min-h-screen flex justify-center" style={{ background: "#EDEAE0" }}>
      <div className="w-full flex flex-col relative" style={{ maxWidth: 430, background: COLORS.bg, fontFamily: "'Inter', sans-serif", minHeight: "100vh" }}>
        <div className="flex-1 overflow-y-auto" style={{ paddingBottom: 84 }}>
          <ActiveScreen />
        </div>
        <div className="fixed bottom-0 flex items-stretch" style={{ width: "100%", maxWidth: 430, background: COLORS.card, borderTop: `1px solid ${COLORS.line}`, paddingBottom: 8 }}>
          {TABS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex-1 flex flex-col items-center gap-1 pt-2.5 pb-1">
                <Icon name={t.icon} size={19} style={{ color: active ? COLORS.sage : COLORS.inkSoft }} />
                <span className="text-[10.5px]" style={{ color: active ? COLORS.sage : COLORS.inkSoft, fontWeight: active ? 600 : 400 }}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
