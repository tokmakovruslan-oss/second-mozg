function Turtle({ pose, height, className = "", style = {} }) {

  return <img src={ART.icon} alt="" draggable={false} style={{ width: size, height: size, borderRadius: size * 0.24, flexShrink: 0 }} />;
}

const pad = (n) => String(n).padStart(2, "0");
const localDateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function yearsOld(birth) {
  if (!birth) return null;
  return Math.floor((Date.now() - new Date(birth).getTime()) / (365.25 * 86400000));
}
function yearsWord(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return "год";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return "года";
  return "лет";
}

function H1({ children }) {
  return <h1 className="text-[27px] leading-tight" style={{ color: C.ink, fontWeight: 800, letterSpacing: "-0.3px" }}>{children}</h1>;
}
function Card({ children, className = "", style = {} }) {
  return <div className={className} style={{ background: C.card, boxShadow: RING, borderRadius: 22, ...style }}>{children}</div>;
}
const inputStyle = { boxShadow: RING, color: C.ink, background: "#fff" };

function useFamily() {
  const [familyId, setFamilyId] = useState(null);
  const [kids, setKids] = useState([]);
  const [loading, setLoading] = useState(true);

  const reload = async () => {
    // Server-side: returns the family, creating it (with membership) on first login
    const { data: fid, error } = await sb.rpc("ensure_my_family");
    if (error) { console.error("ensure_my_family:", error); setLoading(false); return; }
    setFamilyId(fid);
    if (fid) {
      const { data } = await sb.from("children").select("id, name, birth_date, color").eq("family_id", fid).order("created_at");
      setKids(data || []);
    }
    setLoading(false);
  };
  useEffect(() => { reload(); }, []);
  return { familyId, kids, loading, reload };
}

function ChildPicker({ kids, activeId, onChange, onAddClick, includeAll = false }) {
  if (kids.length === 0) return null;
  const chip = (id, label, color) => {
    const active = activeId === id;
    return (
      <button key={id} onClick={() => onChange(id)} className="shrink-0 rounded-full px-4 py-1.5 text-[14px]"

        {label}
      </button>
    );

  return (
    <div className="flex gap-2 overflow-x-auto px-5 md:px-8 pb-3">
      {includeAll && chip("all", "Все", C.ink)}
      {kids.map((k) => chip(k.id, k.name, k.color || C.leaf))}
      {onAddClick && (
        <button onClick={onAddClick} className="shrink-0 rounded-full px-3 py-1.5 flex items-center gap-1" style={{ color: C.leaf, boxShadow: RING, background: "#fff", fontWeight: 700 }}>
          <Icon name="plus" size={14} /><span className="text-[14px]">ребёнок</span>
        </button>
      )}
    </div>

}

function AddChildForm({ familyId, existingCount, onDone }) {
  const [name, setName] = useState("");
  const [birth, setBirth] = useState("");
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);
  const save = async () => {

    if (!familyId) return setErr("Семья ещё не загрузилась. Обновите страницу и попробуйте снова.");

const checkedInThisLaunch = new Set(); // one fresh question per child per app launch
const CHECKIN_AFTER_MS = 6 * 3600 * 1000;

function fmtEventWhen(iso) {
  return new Date(iso).toLocaleString("ru-RU", { weekday: "short", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}

function TurtleScreen({ familyId, kids, activeKid, onPickChild, reloadFamily, goTo }) {
  const [messages, setMessages] = useState([]);
  const [loadingMsgs, setLoadingMsgs] = useState(true);
  const [value, setValue] = useState("");
  const [thinking, setThinking] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const scrollRef = useRef(null);

  const callTurtle = async (text, childId) => {
    setThinking(true);
    if (text) setMessages((p) => [...p, { id: "u" + Date.now(), role: "user", content: text }]);
    const { data: sess } = await sb.auth.getSession();
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/turtle-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sess.session?.access_token },
        body: JSON.stringify({ child_id: childId, message: text || null, tz_offset_min: -new Date().getTimezoneOffset() }),
      });
      const data = await res.json();
      setThinking(false);
      if (!res.ok) { setMessages((p) => [...p, { id: "e" + Date.now(), role: "turtle", content: data.error || "Что-то пошло не так — попробуйте ещё раз.", isError: true }]); return; }
      setMessages((p) => [...p, { id: "t" + Date.now(), role: "turtle", content: data.reply, quick_replies: data.quick_replies, events: data.events_created }]);
    } catch (e) {
      setThinking(false);
      setMessages((p) => [...p, { id: "e" + Date.now(), role: "turtle", content: "Нет связи. Проверьте интернет и отправьте ещё раз.", isError: true }]);
    }
  };

  useEffect(() => {
    if (!activeKid) { setLoadingMsgs(false); return; }
    let cancelled = false;
    (async () => {
      setLoadingMsgs(true);
      const { data } = await sb.from("turtle_messages").select("id, role, content, quick_replies, created_at").eq("child_id", activeKid.id).order("created_at");
      if (cancelled) return;
      const list = data || [];
      setMessages(list);
      setLoadingMsgs(false);
      const last = list[list.length - 1];
      const stale = !last || Date.now() - new Date(last.created_at).getTime() > CHECKIN_AFTER_MS;
      if (stale && !checkedInThisLaunch.has(activeKid.id)) {
        checkedInThisLaunch.add(activeKid.id);
        callTurtle(null, activeKid.id);
      }
    })();
    return () => { cancelled = true; };
  }, [activeKid?.id]);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, thinking]);

  const send = (text) => { const t = (text ?? value).trim(); if (!t || thinking || !activeKid) return; setValue(""); callTurtle(t, activeKid.id); };

  if (kids.length === 0) {
    return (
      <div className="pb-8 flex flex-col items-center text-center pt-8">
        <Turtle pose="wave" height={170} className="bob" />
        <div className="px-8 mt-4 mb-5">
          <H1>Давайте познакомимся</H1>
          <p className="text-[15.5px] mt-2 leading-relaxed" style={{ color: C.inkSoft }}>
            Я буду помнить всё важное о ваших детях и подсказывать, когда это нужно. Начнём с имени — остальное узнаю понемногу, без анкет.
          </p>
        </div>
        <div className="w-full text-left"><AddChildForm familyId={familyId} existingCount={0} onDone={(k) => { reloadFamily(); onPickChild(k.id); }} /></div>
      </div>
    );
  }

  const last = messages[messages.length - 1];
  const quickReplies = last && last.role === "turtle" && !last.isError ? (last.quick_replies || []) : [];

  return (
    <div className="flex flex-col" style={{ height: "100dvh" }}>
      <div className="px-5 md:px-8 pt-5 pb-3 flex items-center gap-3">
        <Avatar size={44} />
        <div className="min-w-0">
          <p className="text-[19px] leading-tight" style={{ color: C.ink, fontWeight: 800 }}>Мудрая Черепаха</p>
          <p className="text-[13px]" style={{ color: C.inkSoft }}>не спешит — и потому многое помнит</p>
        </div>
      </div>
      <ChildPicker kids={kids} activeId={activeKid?.id} onChange={onPickChild} onAddClick={() => setShowAdd((v) => !v)} />
      {showAdd && <AddChildForm familyId={familyId} existingCount={kids.length} onDone={(k) => { setShowAdd(false); reloadFamily(); onPickChild(k.id); }} />}

      <div ref={scrollRef} className="flex-1 overflow-y-auto px-5 md:px-8 space-y-3 pb-3">
        {loadingMsgs ? (
          <div className="flex flex-col items-center pt-10" style={{ color: C.inkSoft }}>
            <Turtle pose="reading" height={110} />
            <p className="text-[14px] mt-2">Листаю записи…</p>
          </div>
        ) : messages.map((m) => (
          <div key={m.id}>
            <div className={`flex ${m.role === "user" ? "justify-end" : "justify-start"} items-end gap-2`}>
              {m.role === "turtle" && <Avatar size={28} />}
              <div className="max-w-[80%] px-4 py-2.5 text-[15.5px] leading-relaxed whitespace-pre-wrap"
                style={m.role === "user"
                  ? { background: C.leaf, color: "#fff", borderRadius: "20px 20px 6px 20px" }
                  : { background: "#fff", color: m.isError ? C.danger : C.ink, boxShadow: RING, borderRadius: "20px 20px 20px 6px" }}>
                {m.content}
              </div>
            </div>
            {m.events && m.events.length > 0 && (
              <button onClick={() => goTo("calendar")} className="ml-9 mt-2 flex items-start gap-2 text-left px-3 py-2 rounded-2xl" style={{ background: C.leafLight, color: C.leaf }}>
                <Icon name="calendar" size={16} style={{ marginTop: 2 }} />
                <span className="text-[13.5px]" style={{ fontWeight: 600 }}>
                  В календаре: {m.events.map((e) => `${e.title} — ${fmtEventWhen(e.starts_at)}`).join("; ")}
                </span>
              </button>
            )}
          </div>
        ))}
        {thinking && (
          <div className="flex items-end gap-2">
            <Turtle pose="reading" height={44} />
            <div className="px-4 py-2.5 text-[14px]" style={{ background: "#fff", boxShadow: RING, borderRadius: "20px 20px 20px 6px", color: C.inkSoft }}>
              думаю не спеша…
            </div>
          </div>
        )}
      </div>

      <div className="px-5 md:px-8 pt-2 pb-[92px] md:pb-6" style={{ background: C.sky }}>
        {quickReplies.length > 0 && !thinking && (
          <div className="flex flex-wrap gap-2 mb-2.5">
            {quickReplies.map((q, i) => (
              <button key={i} onClick={() => send(q)} className="rounded-full px-4 py-2 text-[14.5px]"
                style={{ background: C.shellLight, color: C.shell, fontWeight: 700 }}>
                {q}
              </button>
            ))}
          </div>
        )}
        <div className="flex items-center gap-2 pl-4 pr-1.5 py-1.5" style={{ background: "#fff", boxShadow: RING, borderRadius: 999 }}>
          <input value={value} onChange={(e) => setValue(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()}
            placeholder="Свой ответ или вопрос…" className="flex-1 bg-transparent outline-none text-[15.5px]" style={{ color: C.ink }} />
          <button onClick={() => send()} disabled={thinking || !value.trim()} aria-label="Отправить"
            className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 disabled:opacity-40" style={{ background: C.leaf, color: "#fff" }}>
            <Icon name="send" size={16} />
          </button>
        </div>
      </div>
    </div>
  );
}

function dayLabel(key) {
  const today = new Date(); const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);
  if (key === localDateKey(today)) return "Сегодня";
  if (key === localDateKey(tomorrow)) return "Завтра";
  const [y, m, d] = key.split("-").map(Number);
  const s = new Date(y, m - 1, d).toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function CalendarScreen({ familyId, kids }) {
  const [filter, setFilter] = useState("all");
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [title, setTitle] = useState("");
  const [date, setDate] = useState(localDateKey(new Date()));
  const [time, setTime] = useState("");
  const [childId, setChildId] = useState("");
  const [location, setLocation] = useState("");
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);

  const load = async () => {
    setLoading(true);
    const from = new Date(); from.setHours(0, 0, 0, 0);
    const { data } = await sb.from("events").select("id, title, starts_at, location, child_id, source").eq("family_id", familyId).gte("starts_at", from.toISOString()).order("starts_at");
    setEvents(data || []);
    setLoading(false);
  };
  useEffect(() => { if (familyId) load(); }, [familyId]);

  const save = async () => {
    if (!title.trim() || !date) return;
    setSaving(true); setErr(null);
    const startsAt = new Date(`${date}T${time || "09:00"}`);
    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from("events").insert({
      family_id: familyId, child_id: childId || null, title: title.trim(), starts_at: startsAt.toISOString(),
      location: location.trim() || null, source: "manual", created_by: user?.id,
    });
    setSaving(false);
    if (error) return setErr("Не получилось сохранить: " + error.message);
    setTitle(""); setTime(""); setLocation(""); setShowAdd(false);
    load();
  };

  const remove = async (id) => {
    if (!window.confirm("Удалить событие?")) return;
    await sb.from("events").delete().eq("id", id);
    setEvents((p) => p.filter((e) => e.id !== id));
  };

  const kidOf = (id) => kids.find((k) => k.id === id);
  const visible = filter === "all" ? events : events.filter((e) => e.child_id === filter || !e.child_id);
  const groups = [];
  visible.forEach((e) => {
    const key = localDateKey(new Date(e.starts_at));
    let g = groups.find((x) => x.key === key);
    if (!g) { g = { key, items: [] }; groups.push(g); }
    g.items.push(e);
  });
  const hasOverlap = (items) => items.some((a, i) => items.some((b, j) => j > i && a.child_id !== b.child_id &&
    Math.abs(new Date(a.starts_at) - new Date(b.starts_at)) < 60 * 60000));

  return (
    <div className="pb-[96px] md:pb-8">
      <div className="px-5 md:px-8 pt-6 pb-3 flex items-center justify-between gap-3">
        <H1>Календарь</H1>
        <button onClick={() => setShowAdd((v) => !v)} className="rounded-full px-4 py-2 flex items-center gap-1.5 text-white text-[14.5px]" style={{ background: C.leaf, fontWeight: 700 }}>
          <Icon name={showAdd ? "x" : "plus"} size={15} />{showAdd ? "Закрыть" : "Событие"}
        </button>
      </div>
      <ChildPicker kids={kids} activeId={filter} onChange={setFilter} includeAll />

      {showAdd && (
        <Card className="mx-5 md:mx-8 p-4 mb-4">
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Что будет? Например, «Соревнования по плаванию»"
            className="w-full rounded-full px-4 py-2.5 text-[15px] mb-2 outline-none" style={inputStyle} />
          <div className="flex gap-2 mb-2">
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="flex-1 min-w-0 rounded-full px-4 py-2.5 text-[15px] outline-none" style={inputStyle} />
            <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-[120px] rounded-full px-4 py-2.5 text-[15px] outline-none" style={inputStyle} />
          </div>
          <input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="Где (необязательно)"
            className="w-full rounded-full px-4 py-2.5 text-[15px] mb-2 outline-none" style={inputStyle} />
          <select value={childId} onChange={(e) => setChildId(e.target.value)} className="w-full rounded-full px-4 py-2.5 text-[15px] mb-3 outline-none" style={inputStyle}>
            <option value="">Для всей семьи</option>
            {kids.map((k) => <option key={k.id} value={k.id}>{k.name}</option>)}
          </select>
          <button disabled={saving || !title.trim() || !date} onClick={save} className="w-full rounded-full py-3 text-[15px] text-white disabled:opacity-50" style={{ background: C.leaf, fontWeight: 700 }}>
            {saving ? "Сохраняю…" : "Добавить в календарь"}
          </button>
          {err && <p className="text-[13px] mt-2" style={{ color: C.danger }}>{err}</p>}
        </Card>
      )}

      <div className="px-5 md:px-8 space-y-5">
        {loading ? (
          <p className="text-[14px]" style={{ color: C.inkSoft }}>Загрузка…</p>
        ) : groups.length === 0 ? (
          <div className="flex flex-col items-center text-center pt-6">
            <Turtle pose="sleep" height={120} />
            <p className="text-[17px] mt-3" style={{ color: C.ink, fontWeight: 700 }}>Пока тихо</p>
            <p className="text-[14.5px] mt-1 max-w-[320px] leading-relaxed" style={{ color: C.inkSoft }}>
              Добавьте событие кнопкой выше — или просто напишите черепахе: «в субботу в 11 соревнования».
            </p>
          </div>
        ) : groups.map((g) => (
          <div key={g.key}>
            <div className="flex items-baseline gap-2 mb-2">
              <p className="text-[15px]" style={{ color: C.ink, fontWeight: 800 }}>{dayLabel(g.key)}</p>
              {hasOverlap(g.items) && <span className="text-[13px]" style={{ color: C.danger, fontWeight: 700 }}>· события пересекаются по времени</span>}
            </div>
            <Card style={{ overflow: "hidden" }}>
              {g.items.map((e, i) => {
                const kid = kidOf(e.child_id);
                return (
                  <div key={e.id} className="flex items-start gap-3 px-4 py-3" style={{ borderTop: i ? `1px solid ${C.line}` : "none" }}>
                    <span className="w-1 self-stretch rounded-full shrink-0" style={{ background: kid?.color || C.inkSoft }} />
                    <span className="text-[15px] w-12 shrink-0" style={{ color: C.ink, fontWeight: 800 }}>
                      {new Date(e.starts_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}
                    </span>
                    <div className="flex-1 min-w-0">
                      <p className="text-[15.5px] leading-snug" style={{ color: C.ink, fontWeight: 600 }}>{e.title}</p>
                      <p className="text-[13px] mt-0.5" style={{ color: C.inkSoft }}>
                        {kid ? kid.name : "Вся семья"}
                        {e.location && <> · {e.location}</>}
                        {e.source === "turtle" && <> · из разговора с черепахой</>}
                      </p>
                    </div>
                    <button onClick={() => remove(e.id)} aria-label="Удалить" className="shrink-0 p-1" style={{ color: C.inkSoft }}><Icon name="x" size={16} /></button>
                  </div>
                );
              })}
            </Card>
          </div>
        ))}
      </div>
    </div>
  );
}

      <ChildPicker kids={kids} activeId={activeKid?.id} onChange={onPickChild} />
      <div className="px-5 md:px-8 mb-4">
        <button disabled={generating} onClick={generate} className="rounded-full px-5 py-2.5 flex items-center gap-2 text-[15px] text-white disabled:opacity-60" style={{ background: C.shell, fontWeight: 700 }}>
          <Icon name="sparkles" size={16} />{generating ? "Придумываю…" : "Придумать ещё"}
        </button>
        {err && <p className="text-[13px] mt-2" style={{ color: C.danger }}>{err}</p>}
      </div>
      <div className="px-5 md:px-8 space-y-3">
        {loading ? (
          <p className="text-[14px]" style={{ color: C.inkSoft }}>Загрузка…</p>
        ) : ideas.length === 0 ? (
          <div className="flex flex-col items-center text-center pt-4">
            <Turtle pose="meditate" height={110} />
            <p className="text-[14.5px] mt-3 max-w-[320px] leading-relaxed" style={{ color: C.inkSoft }}>
              Нажмите «Придумать ещё» — подберу занятия под возраст и интересы. Чем больше расскажете в чате, тем точнее идеи.
            </p>
          </div>
        ) : ideas.map((idea) => (
          <Card key={idea.id} className="p-4">
            <div className="flex items-start gap-3">
              <div className="flex-1 min-w-0">
                {idea.category && <p className="text-[12.5px]" style={{ color: C.pond, fontWeight: 700 }}>{idea.category.charAt(0).toUpperCase() + idea.category.slice(1)}</p>}
                <p className="text-[17px] leading-snug mt-0.5" style={{ color: C.ink, fontWeight: 800 }}>{idea.title}</p>
                {idea.description && <p className="text-[14.5px] mt-1 leading-relaxed" style={{ color: C.inkSoft }}>{idea.description}</p>}
              </div>
              <button onClick={() => dismiss(idea.id)} aria-label="Скрыть идею" className="shrink-0 p-1" style={{ color: C.inkSoft }}><Icon name="x" size={16} /></button>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Tab: Дети
// ---------------------------------------------------------------------------
const DOC_KINDS = [
  { value: "birth_certificate", label: "Свидетельство о рождении" },
  { value: "medical", label: "Медицинская карта" },
  { value: "vaccination", label: "Прививки" },
  { value: "other", label: "Другое" },
];

function ChildrenScreen({ familyId, kids, activeKid, onPickChild, reloadFamily }) {
  const [showAdd, setShowAdd] = useState(false);
  const [facts, setFacts] = useState([]);
  const [docs, setDocs] = useState([]);
  const [loadingDetail, setLoadingDetail] = useState(true);
  const [uploading, setUploading] = useState(false);
  const [docKind, setDocKind] = useState("birth_certificate");
  const [err, setErr] = useState(null);
  const fileRef = useRef(null);

  const loadDetail = async (childId) => {
    setLoadingDetail(true);
    const { data: f } = await sb.from("child_profile_facts").select("id, category, fact").eq("child_id", childId).order("created_at", { ascending: false });
    const { data: d } = await sb.from("child_documents").select("id, kind, file_path").eq("child_id", childId).order("created_at", { ascending: false });
    setFacts(f || []); setDocs(d || []); setLoadingDetail(false);
  };
  useEffect(() => { if (activeKid) loadDetail(activeKid.id); }, [activeKid?.id]);

  const upload = async (file) => {
    if (!file || !activeKid || !familyId) return;
    setUploading(true); setErr(null);
    const safeName = file.name.replace(/[^\w.\-]+/g, "_");
    const path = `${familyId}/${activeKid.id}/${Date.now()}_${safeName}`;
    const { error: upErr } = await sb.storage.from("child-documents").upload(path, file);
    if (upErr) { setErr("Не получилось загрузить: " + upErr.message); setUploading(false); return; }
    await sb.from("child_documents").insert({ child_id: activeKid.id, family_id: familyId, kind: docKind, file_path: path });
    setUploading(false);
    loadDetail(activeKid.id);
  };

  const openDoc = async (path) => {
    const { data } = await sb.storage.from("child-documents").createSignedUrl(path, 120);
    if (data?.signedUrl) window.open(data.signedUrl, "_blank");
  };

  const deleteFact = async (id) => { await sb.from("child_profile_facts").delete().eq("id", id); setFacts((p) => p.filter((f) => f.id !== id)); };

  const grouped = {};
  facts.forEach((f) => { (grouped[f.category] = grouped[f.category] || []).push(f); });

  if (kids.length === 0) {
    return (
      <div className="pt-6 pb-[96px]">
        <div className="px-5 md:px-8 mb-4"><H1>Дети</H1></div>
        <AddChildForm familyId={familyId} existingCount={0} onDone={(k) => { reloadFamily(); onPickChild(k.id); }} />
      </div>
    );
  }

  const age = activeKid ? yearsOld(activeKid.birth_date) : null;

  return (
    <div className="pb-[96px] md:pb-8">
      <div className="px-5 md:px-8 pt-6 pb-3"><H1>Дети</H1></div>
      <ChildPicker kids={kids} activeId={activeKid?.id} onChange={onPickChild} onAddClick={() => setShowAdd((v) => !v)} />
      {showAdd && <AddChildForm familyId={familyId} existingCount={kids.length} onDone={(k) => { setShowAdd(false); reloadFamily(); onPickChild(k.id); }} />}

      {activeKid && (
        <div className="px-5 md:px-8 space-y-4">
          <Card className="p-5">
            <p className="text-[24px]" style={{ color: activeKid.color || C.leaf, fontWeight: 800 }}>{activeKid.name}</p>
            <p className="text-[14.5px]" style={{ color: C.inkSoft }}>{age != null ? `${age} ${yearsWord(age)}` : "Дата рождения не указана"}</p>
          </Card>

          <Card className="p-5">
            <p className="text-[17px] mb-3" style={{ color: C.ink, fontWeight: 800 }}>Что черепаха уже знает</p>
            {loadingDetail ? (
              <p className="text-[14px]" style={{ color: C.inkSoft }}>Загрузка…</p>
            ) : Object.keys(grouped).length === 0 ? (
              <p className="text-[14.5px] leading-relaxed" style={{ color: C.inkSoft }}>Пока ничего. Ответьте на пару вопросов в чате — факты появятся здесь сами.</p>
            ) : (
              <div className="space-y-4">
                {Object.entries(grouped).map(([cat, items]) => (
                  <div key={cat}>
                    <p className="text-[13px] mb-1.5" style={{ color: C.pond, fontWeight: 800 }}>{CATEGORY_LABEL[cat] || cat}</p>
                    <ul className="space-y-1.5">
                      {items.map((it) => (
                        <li key={it.id} className="flex items-start gap-2 text-[15px] leading-snug" style={{ color: C.ink }}>
                          <span className="mt-[7px] w-1.5 h-1.5 rounded-full shrink-0" style={{ background: activeKid.color || C.leaf }} />
                          <span className="flex-1">{it.fact}</span>
                          <button onClick={() => deleteFact(it.id)} aria-label="Удалить факт" className="shrink-0" style={{ color: "#9AAEBF" }}><Icon name="x" size={14} /></button>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            )}
          </Card>

          <Card className="p-5">
            <p className="text-[17px] mb-3" style={{ color: C.ink, fontWeight: 800 }}>Документы</p>
            <div className="flex gap-2">
              <select value={docKind} onChange={(e) => setDocKind(e.target.value)} className="flex-1 min-w-0 rounded-full px-4 py-2.5 text-[14.5px] outline-none" style={inputStyle}>
                {DOC_KINDS.map((k) => <option key={k.value} value={k.value}>{k.label}</option>)}
              </select>
              <input ref={fileRef} type="file" accept="image/*,application/pdf" onChange={(e) => { upload(e.target.files[0]); e.target.value = ""; }} className="hidden" />
              <button disabled={uploading} onClick={() => fileRef.current.click()} className="shrink-0 rounded-full px-4 py-2.5 text-[14.5px] flex items-center gap-1.5 disabled:opacity-60" style={{ background: C.leafLight, color: C.leaf, fontWeight: 700 }}>
                <Icon name="file" size={15} />{uploading ? "Загружаю…" : "Загрузить"}
              </button>
            </div>
            {err && <p className="text-[13px] mt-2" style={{ color: C.danger }}>{err}</p>}
            {docs.length > 0 && (
              <ul className="mt-3 space-y-1">
                {docs.map((d) => (
                  <li key={d.id}>
                    <button onClick={() => openDoc(d.file_path)} className="text-[14.5px] flex items-center gap-2 py-1" style={{ color: C.pond, fontWeight: 600 }}>
                      <Icon name="file" size={14} />{(DOC_KINDS.find((k) => k.value === d.kind) || {}).label || d.kind}
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </Card>
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Вход
// ---------------------------------------------------------------------------
function AuthGate() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const signIn = async () => { setBusy(true); const { error } = await sb.auth.signInWithPassword({ email, password }); setBusy(false); if (error) setMsg({ text: "Не получилось войти: проверьте почту и пароль.", ok: false }); };
  const signUp = async () => {
    setBusy(true); const { error } = await sb.auth.signUp({ email, password }); setBusy(false);
    if (error) return setMsg({ text: error.message, ok: false });
    setMsg({ text: "Аккаунт создан. Нажмите «Войти».", ok: true });
  };
  return (
    <div className="w-full min-h-screen flex justify-center items-center py-10" style={{ background: C.sky }}>
      <div className="w-full flex flex-col items-center px-5" style={{ maxWidth: 400 }}>
        <Turtle pose="main" height={230} className="bob" />
        <p className="text-[30px] mt-2 text-center leading-tight" style={{ color: C.ink, fontWeight: 800 }}>Мудрая Черепаха</p>
        <p className="text-[15.5px] mt-1 mb-6 text-center" style={{ color: C.inkSoft }}>Помнит всё важное о ваших детях, чтобы вам не приходилось</p>
        <Card className="w-full p-5">
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Почта" autoComplete="email"
            className="w-full rounded-full px-4 py-3 text-[15.5px] mb-3 outline-none" style={inputStyle} />
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Пароль" autoComplete="current-password"
            onKeyDown={(e) => e.key === "Enter" && signIn()}
            className="w-full rounded-full px-4 py-3 text-[15.5px] mb-4 outline-none" style={inputStyle} />
          <button disabled={busy} onClick={signIn} className="w-full rounded-full py-3 text-[16px] text-white mb-2" style={{ background: C.leaf, fontWeight: 800 }}>Войти</button>
          <button disabled={busy} onClick={signUp} className="w-full rounded-full py-3 text-[15px]" style={{ background: "transparent", color: C.ink, boxShadow: "0 0 0 1px #A9BFD2", fontWeight: 700 }}>Создать аккаунт</button>
          {msg && <p className="text-[13.5px] mt-3 text-center" style={{ color: msg.ok ? C.leaf : C.danger }}>{msg.text}</p>}
        </Card>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Оболочка приложения
// ---------------------------------------------------------------------------
const TABS = [
  { key: "turtle", label: "Черепаха", icon: "chat" },
  { key: "calendar", label: "Календарь", icon: "calendar" },
  { key: "ideas", label: "Идеи", icon: "sparkles" },
  { key: "kids", label: "Дети", icon: "kid" },
];

function MainApp() {
  const { familyId, kids, loading, reload } = useFamily();
  const [tab, setTab] = useState("turtle");
  const [activeKidId, setActiveKidId] = useState(null);

  useEffect(() => { if (kids.length && !kids.find((k) => k.id === activeKidId)) setActiveKidId(kids[0].id); }, [kids]);
  const activeKid = kids.find((k) => k.id === activeKidId) || null;

  if (loading) {
    return (
      <div className="w-full min-h-screen flex flex-col items-center justify-center" style={{ background: C.sky }}>
        <Turtle pose="reading" height={120} />
        <p className="text-[15px] mt-3" style={{ color: C.inkSoft }}>Черепаха открывает записи…</p>
      </div>
    );
  }

  const props = { familyId, kids, activeKid, onPickChild: setActiveKidId, reloadFamily: reload, goTo: setTab };

  return (
    <div className="w-full min-h-screen md:flex" style={{ background: C.skyDeep }}>
      <nav className="hidden md:flex md:flex-col md:w-64 md:shrink-0 md:py-6 md:px-3 md:sticky md:top-0 md:h-screen" style={{ background: C.skyDeep }}>
        <div className="px-3 mb-7 flex items-center gap-2.5">
          <Avatar size={40} />
          <p className="text-[18px] leading-tight" style={{ color: C.ink, fontWeight: 800 }}>Мудрая Черепаха</p>
        </div>
        <div className="flex flex-col gap-1">
          {TABS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex items-center gap-3 px-3 py-2.5 rounded-2xl text-left"
                style={{ background: active ? "#fff" : "transparent", color: active ? C.leaf : C.inkSoft, boxShadow: active ? RING : "none" }}>
                <Icon name={t.icon} size={19} />
                <span className="text-[15.5px]" style={{ fontWeight: active ? 800 : 600 }}>{t.label}</span>
              </button>
            );
          })}
        </div>
        <button onClick={() => sb.auth.signOut()} className="mt-auto flex items-center gap-2 px-3 py-2 text-[14px]" style={{ color: C.inkSoft, fontWeight: 600 }}>
          <Icon name="logout" size={16} />Выйти
        </button>
      </nav>

      <div className="flex justify-center md:flex-1">
        <main className="w-full max-w-[480px] md:max-w-[760px] relative" style={{ background: C.sky, minHeight: "100vh" }}>
          {tab === "turtle" && <TurtleScreen {...props} />}
          {tab === "calendar" && <CalendarScreen {...props} />}
          {tab === "ideas" && <IdeasScreen {...props} />}
          {tab === "kids" && <ChildrenScreen {...props} />}
        </main>
      </div>

      <nav className="md:hidden fixed bottom-0 left-0 right-0 flex justify-center" style={{ background: C.skyDeep, paddingBottom: "max(8px, env(safe-area-inset-bottom))" }}>
        <div className="w-full max-w-[480px] flex">
          {TABS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex-1 flex flex-col items-center gap-0.5 pt-2.5 pb-1">
                <Icon name={t.icon} size={21} style={{ color: active ? C.leaf : C.inkSoft }} />
                <span className="text-[11.5px]" style={{ color: active ? C.leaf : C.inkSoft, fontWeight: active ? 800 : 600 }}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div className="w-full min-h-screen" style={{ background: C.sky }} />;
  if (!session) return <AuthGate />;
  return <MainApp />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
