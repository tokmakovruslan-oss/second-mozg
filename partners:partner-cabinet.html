<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет партнёра — Второй мозг родителя</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f7f7f9; --card:#fff; --text:#1a1a1a; --muted:#6b6b6b;
    --accent:#0891b2; --accent-hover:#0e7490; --border:#e5e5e8;
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:1.5rem}
  .wrap{max-width:560px; margin:0 auto}
  h1{font-size:1.3rem; margin:0 0 .3rem}
  .sub{color:var(--muted); font-size:.9rem; margin:0 0 1.5rem}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.1rem 1.2rem; margin-bottom:1rem}
  .card h2{font-size:1rem; margin:0 0 .8rem}
  .card h3{font-size:.95rem; margin:0 0 .4rem}
  label{display:block; font-size:.85rem; color:var(--muted); margin:.6rem 0 .25rem}
  input[type=email], input[type=password], input[type=text], input[type=datetime-local]{
    width:100%; padding:.6rem .7rem; border:1px solid var(--border); border-radius:9px; font-size:.95rem;
  }
  button{background:var(--accent); color:#fff; border:none; border-radius:9px; padding:.6rem 1rem; font-size:.88rem; font-weight:600; cursor:pointer; margin-top:.7rem}
  button:hover{background:var(--accent-hover)}
  button.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent); font-size:.8rem; padding:.4rem .7rem}
  button:disabled{opacity:.45; cursor:not-allowed}
  .msg{font-size:.85rem; padding:.5rem .7rem; border-radius:8px; margin-top:.6rem}
  .msg.error{background:#fef2f2; color:#dc2626}
  .msg.ok{background:#f0fdf4; color:#15803d}
  .child-block{border-top:1px solid var(--border); padding-top:.8rem; margin-top:.8rem}
  .child-block:first-child{border-top:none; padding-top:0; margin-top:0}
  .slot{display:flex; justify-content:space-between; font-size:.85rem; padding:.3rem 0; color:var(--text)}
  .slot .when{color:var(--muted)}
  .scopes{font-size:.75rem; color:var(--muted); margin-bottom:.4rem}
  .hidden{display:none}
  a.link{color:var(--accent); font-size:.85rem; cursor:pointer}
  .empty{color:var(--muted); font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <a class="link" href="index.html" style="display:inline-block;margin-bottom:.8rem">← Партнёрам «Второго мозга»</a>
  <h1>🏫 Кабинет партнёра</h1>
  <p class="sub">Расписание детей, доступ к которым вам выдали родители</p>

  <div class="card" id="authCard">
    <h2>Вход</h2>
    <label>Email</label>
    <input type="email" id="email">
    <label>Пароль</label>
    <input type="password" id="password">
    <button onclick="signIn()">Войти</button>
    <div id="authMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card" id="orgCard"></div>
    <div class="card">
      <h2>Ваши дети</h2>
      <div id="childrenList" class="empty">Загрузка…</div>
    </div>
    <a class="link" onclick="signOut()">Выйти</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rmjwdzoffrnuqokkzgdn.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtandkem9mZnJudXFva2t6Z2RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMjA4ODAsImV4cCI6MjA5NzY5Njg4MH0.cI-Vs-n8uRyBmJNF4RAL3c4sxC98KHIJt769NUD4jEM';
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);

function showMsg(elId, text, ok){
  document.getElementById(elId).innerHTML = `<div class="msg ${ok ? 'ok' : 'error'}">${text}</div>`;
}

async function signIn(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return showMsg('authMsg', error.message, false);
  enterApp();
}

async function signOut(){
  await sb.auth.signOut();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authCard').classList.remove('hidden');
}

async function enterApp(){
  document.getElementById('authCard').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await loadOrgAndChildren();
}

async function loadOrgAndChildren(){
  const { data: memberships, error: mErr } = await sb
    .from('organization_members')
    .select('organization_id, role, organizations(name, type)');

  const orgCard = document.getElementById('orgCard');
  if (mErr || !memberships || memberships.length === 0) {
    orgCard.innerHTML = `<div class="msg error">Этот аккаунт пока не привязан ни к одной организации. Попросите администратора добавить вас в organization_members.</div>`;
    document.getElementById('childrenList').innerHTML = '';
    return;
  }

  const org = memberships[0]; // MVP: одна организация на сотрудника
  orgCard.innerHTML = `<h2>${org.organizations.name}</h2><div class="scopes">Ваша роль: ${org.role}</div>`;

  const { data: grants, error: gErr } = await sb
    .from('partner_access')
    .select('id, child_id, scopes, children(name)')
    .eq('organization_id', org.organization_id)
    .eq('status', 'active');

  const listEl = document.getElementById('childrenList');
  if (gErr) { listEl.innerHTML = `<div class="msg error">${gErr.message}</div>`; return; }
  if (!grants || grants.length === 0) { listEl.innerHTML = '<p class="empty">Пока ни один родитель не подключил вас.</p>'; return; }

  listEl.innerHTML = '';
  for (const g of grants) {
    const block = document.createElement('div');
    block.className = 'child-block';
    block.innerHTML = `
      <h3>${g.children?.name ?? 'Ребёнок'}</h3>
      <div class="scopes">Права: ${g.scopes.join(', ')}</div>
      <div id="slots-${g.id}" class="empty">Загрузка расписания…</div>
      ${g.scopes.includes('schedule:write') ? renderAddForm(g.id, g.child_id, org.organization_id) : ''}
      ${g.scopes.includes('notify:send') ? '<button class="ghost" disabled>🔔 Уведомление родителю (скоро)</button>' : ''}
    `;
    listEl.appendChild(block);
    if (g.scopes.includes('schedule:read')) loadSlots(g.id, g.child_id);
  }
}

function renderAddForm(grantId, childId, orgId){
  return `
    <div style="margin-top:.5rem">
      <label>Новое занятие</label>
      <input type="text" id="title-${grantId}" placeholder="Например, вокал — индивидуальное">
      <div style="display:flex; gap:.5rem; margin-top:.4rem">
        <input type="datetime-local" id="start-${grantId}">
        <input type="datetime-local" id="end-${grantId}">
      </div>
      <button onclick="addSlot('${grantId}','${childId}','${orgId}')">Добавить в расписание</button>
      <div id="addMsg-${grantId}"></div>
    </div>
  `;
}

async function loadSlots(grantId, childId){
  const { data, error } = await sb
    .from('schedule_slots')
    .select('title, starts_at, ends_at, status')
    .eq('child_id', childId)
    .order('starts_at');

  const el = document.getElementById(`slots-${grantId}`);
  if (error) { el.innerHTML = `<div class="msg error">${error.message}</div>`; return; }
  if (!data || data.length === 0) { el.innerHTML = '<p class="empty">Занятий пока не назначено.</p>'; return; }

  el.innerHTML = data.map(s => `
    <div class="slot">
      <span>${s.title}</span>
      <span class="when">${new Date(s.starts_at).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
    </div>
  `).join('');
}

async function addSlot(grantId, childId, orgId){
  const title = document.getElementById(`title-${grantId}`).value.trim();
  const start = document.getElementById(`start-${grantId}`).value;
  const end = document.getElementById(`end-${grantId}`).value;
  if (!title || !start || !end) return showMsg(`addMsg-${grantId}`, 'Заполните название и время', false);

  const { error } = await sb.from('schedule_slots').insert({
    child_id: childId,
    organization_id: orgId,
    title,
    starts_at: new Date(start).toISOString(),
    ends_at: new Date(end).toISOString(),
  });

  if (error) return showMsg(`addMsg-${grantId}`, error.message, false);
  showMsg(`addMsg-${grantId}`, 'Добавлено', true);
  await loadSlots(grantId, childId);
}

sb.auth.getSession().then(({ data }) => { if (data.session) enterApp(); });
</script>
</body>
</html>
